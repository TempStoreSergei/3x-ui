{{define "modals/cloudflareModal"}}
<div id="cf-panel">
    <!-- Cloudflare DNS Section - shown inline as collapsible card -->
    <a-card v-if="cfPanel.visible" :style="{ marginBottom: '12px' }" size="small">
        <template #title>
            <a-space>
                <a-icon type="cloud" :style="{ color: '#f5a623' }"></a-icon>
                <span>Cloudflare DNS Management</span>
            </a-space>
        </template>
        <template #extra>
            <a-button size="small" icon="close" @click="cfPanel.close()"></a-button>
        </template>
        <a-spin :spinning="cfPanel.loading">
            <template v-if="!cfPanel.hasToken">
                <a-result status="info" title="Cloudflare Not Configured"
                    sub-title="Add your Cloudflare API Token in Settings → Cloudflare & DNS to manage DNS records.">
                    <template #extra>
                        <a-button type="primary" @click="window.location.href=basePath+'panel/settings'">
                            <a-icon type="setting"></a-icon> Go to Settings
                        </a-button>
                    </template>
                </a-result>
            </template>
            <template v-else>
                <a-row :gutter="[16, 12]">
                    <a-col :xs="24" :md="8">
                        <a-select v-model="cfPanel.selectedZone" placeholder="Select DNS Zone" :style="{ width: '100%' }"
                            @change="cfPanel.loadRecords()">
                            <a-select-option v-for="z in cfPanel.zones" :key="z.id" :value="z.id">
                                [[ z.name ]] ([[ z.status ]])
                            </a-select-option>
                        </a-select>
                    </a-col>
                    <template v-if="cfPanel.selectedZone">
                        <a-col :xs="6" :md="3">
                            <a-select v-model="cfPanel.newRecord.type" :style="{ width: '100%' }">
                                <a-select-option value="A">A</a-select-option>
                                <a-select-option value="AAAA">AAAA</a-select-option>
                                <a-select-option value="CNAME">CNAME</a-select-option>
                            </a-select>
                        </a-col>
                        <a-col :xs="18" :md="5">
                            <a-input v-model="cfPanel.newRecord.name" placeholder="Name (sub)"></a-input>
                        </a-col>
                        <a-col :xs="16" :md="5">
                            <a-input v-model="cfPanel.newRecord.content" placeholder="IP / domain"></a-input>
                        </a-col>
                        <a-col :xs="4" :md="1">
                            <a-tooltip :title="cfPanel.newRecord.proxied ? 'Proxied (CDN)' : 'DNS Only'">
                                <a-switch v-model="cfPanel.newRecord.proxied" size="small"></a-switch>
                            </a-tooltip>
                        </a-col>
                        <a-col :xs="4" :md="2">
                            <a-button type="primary" icon="plus" @click="cfPanel.addRecord()" block></a-button>
                        </a-col>
                    </template>
                    <a-col :span="24" v-if="cfPanel.selectedZone">
                        <a-table :columns="cfPanel.columns" :data-source="cfPanel.records"
                            :pagination="{ pageSize: 8, size: 'small' }" size="small" row-key="id" bordered>
                            <template slot="proxied" slot-scope="text">
                                <a-tag :color="text ? 'orange' : 'blue'" size="small">[[ text ? 'CDN' : 'DNS' ]]</a-tag>
                            </template>
                            <template slot="action" slot-scope="text, record">
                                <a-popconfirm title="Delete?" @confirm="cfPanel.deleteRecord(record.id)">
                                    <a-button type="link" size="small" icon="delete" :style="{ color: '#ff4d4f' }"></a-button>
                                </a-popconfirm>
                            </template>
                        </a-table>
                    </a-col>
                </a-row>
            </template>
        </a-spin>
    </a-card>
</div>
<script>
    const cfPanel = {
        visible: false,
        loading: false,
        hasToken: false,
        zones: [],
        selectedZone: null,
        records: [],
        newRecord: { type: 'A', name: '', content: '', proxied: false, ttl: 1 },
        columns: [
            { title: 'Type', dataIndex: 'type', width: 60 },
            { title: 'Name', dataIndex: 'name' },
            { title: 'Content', dataIndex: 'content' },
            { title: 'Proxy', dataIndex: 'proxied', scopedSlots: { customRender: 'proxied' }, width: 60 },
            { title: '', scopedSlots: { customRender: 'action' }, width: 40 }
        ],
        show() {
            this.visible = true;
            this.checkToken();
        },
        close() { this.visible = false; },
        async checkToken() {
            this.loading = true;
            const msg = await HttpUtil.get('/panel/api/cloudflare/zones');
            this.loading = false;
            if (msg.success) {
                this.hasToken = true;
                this.zones = msg.obj || [];
            } else {
                this.hasToken = false;
            }
        },
        async loadRecords() {
            if (!this.selectedZone) return;
            this.loading = true;
            const msg = await HttpUtil.get('/panel/api/cloudflare/records/' + this.selectedZone);
            this.loading = false;
            if (msg.success) this.records = msg.obj || [];
        },
        async addRecord() {
            if (!this.newRecord.name || !this.newRecord.content) return;
            this.loading = true;
            const msg = await HttpUtil.post('/panel/api/cloudflare/records/' + this.selectedZone, this.newRecord);
            this.loading = false;
            if (msg.success) {
                this.newRecord = { type: 'A', name: '', content: '', proxied: false, ttl: 1 };
                this.loadRecords();
            }
        },
        async deleteRecord(recordId) {
            this.loading = true;
            await HttpUtil.post('/panel/api/cloudflare/records/' + this.selectedZone + '/delete/' + recordId);
            this.loading = false;
            this.loadRecords();
        }
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#cf-panel',
        data: { cfPanel },
    });
</script>
{{end}}
